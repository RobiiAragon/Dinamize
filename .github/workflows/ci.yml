name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: PHP syntax check
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l | grep -v '^No syntax errors' || true
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: JavaScript syntax check
        run: |
          for f in js/*.js CleanersGame/*.js; do
            case "$f" in *.min.js) continue ;; esac
            node --check "$f"
          done
      - name: Python syntax check
        run: python3 -m py_compile Claves.py "Claves WEB.py"
      - name: No credentials committed
        run: |
          test ! -f config.local.php
          test ! -f .env
